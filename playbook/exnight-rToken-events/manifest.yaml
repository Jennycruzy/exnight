long_description: |
  Exnight is a deterministic research Playbook for people who already hold
  Bitget Reality tokens linked to dividend-paying US securities. It focuses on
  one practical question around an ex-date: is it better to remain exposed or
  step into USDT temporarily? This package is deliberately a selection basket,
  not an automated trader. It publishes a structured decision snapshot and
  leaves any order to the user.

  On each run, the Playbook checks Bitget's corporate-action data for declared
  cash dividends and obtains the current Reality-token spot ticker. A dividend
  is eligible only when it has an ex-date in the configured horizon, a positive
  amount, and a declaration date no later than the run date. The decision uses
  Exnight V1's frozen price-drop estimate and includes two taker fees plus a
  pre-declared modeled slippage allowance. There is no automatic entry: a
  qualifying event enters the research basket, not the user's account.

  Entitlement uncertainty is handled as a range rather than a favourable
  default. EXIT is shown only when it beats HOLD even if the holder retains the
  full gross dividend. HOLD is shown when EXIT still loses at the highest
  configured withholding assumption. If the answer changes within the range,
  the item is marked ENTITLEMENT_UNCERTAIN. This makes the assumption visible
  instead of hiding it inside a single net-dividend estimate.

  The basket includes the exchange symbol, current reference price, ex-date,
  declared dividend, declaration date, edge range and a plain-language risk
  note. Symbols without a qualifying pre-decision declaration are omitted from
  the actionable basket and counted in the run metrics. A later run replaces
  the prior snapshot as dates and market prices change. Subscribers can adjust
  two display parameters: the upcoming-event horizon and maximum basket size.

  This package cannot reproduce Exnight's historical walk-forward scorecard in
  the standard Playbook bar engine because that test needs event-time dividend
  knowledge and frozen fold-specific estimates, not prices alone. Its official
  evidence is therefore paper output. Empty corporate-action data, stale or
  absent Reality-token quotes, unpublished Bitget eligibility snapshot timing,
  withholding uncertainty, fees and thin public books can all prevent a useful
  decision. Basket inclusion is research context, never a promise of return.
market_type: spot
trading_symbols: ["RDGRWUSDT", "RNXPIUSDT", "RSATAUSDT", "RSTRCUSDT", "RTLTUSDT"]
tags: ["rtoken", "corporate-actions", "dividends", "selection-basket"]
