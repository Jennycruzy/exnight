decision_mode: deterministic
backtest_support: none
runtime_profile: deterministic
follow_trade_supported: false
official_evidence_kind: paper
schedule:
  cron: "0 */4 * * *"
  tz: "America/New_York"
strategy_config:
  trading_symbols: ["RDGRWUSDT", "RNXPIUSDT", "RSATAUSDT", "RSTRCUSDT", "RTLTUSDT"]
  pdr_estimate: "0.965611"
  withholding_max: "0.30"
  taker_fee_rate: "0.001"
  modeled_slippage_bps: 25
  lookahead_days: 45
  max_assets: 5
user_config_schema:
  lookahead_days:
    type: integer
    default: 45
    min: 7
    max: 90
    label: "Upcoming ex-date horizon"
  max_assets:
    type: integer
    default: 5
    min: 1
    max: 5
    label: "Maximum events shown"
